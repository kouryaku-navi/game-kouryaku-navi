<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human攻略ナビ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans JP",sans-serif;
background:#f3f5f7;
color:#222;
line-height:1.8;
}

header{
background:#111827;
color:white;
padding:28px 16px;
}

.header{
max-width:1100px;
margin:auto;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:4px 0 0;
color:#cbd5e1;
}

nav{
background:#1f2937;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
overflow:auto;
}

nav a{
color:white;
text-decoration:none;
padding:13px 16px;
white-space:nowrap;
}

main{
max-width:1100px;
margin:30px auto;
padding:0 16px;
}

.search{
background:white;
padding:20px;
border-radius:14px;
margin-bottom:25px;
box-shadow:0 2px 10px #00000012;
}

.search input{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ddd;
border-radius:8px;
}

h2{
margin-top:35px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}

.card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 2px 10px #00000012;
}

.card h3{
margin-top:0;
}

.category{
display:inline-block;
font-size:12px;
background:#e5e7eb;
padding:3px 9px;
border-radius:5px;
margin-bottom:8px;
}

button{
background:#2563eb;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#article{
display:none;
background:white;
padding:28px;
border-radius:14px;
box-shadow:0 2px 10px #00000012;
margin-top:30px;
}

.article-box{
max-width:850px;
}

.article-box h2{
margin-top:0;
}

.article-box h3{
border-left:4px solid #2563eb;
padding-left:10px;
margin-top:30px;
}

.notice{
background:#eef6ff;
padding:15px;
border-radius:8px;
}

.back{
margin-top:25px;
}

footer{
margin-top:50px;
padding:35px;
background:#111827;
color:#cbd5e1;
text-align:center;
}

@media(max-width:600px){
header h1{font-size:24px}
main{margin-top:20px}
.card{padding:18px}
}
</style>
</head>

<body>

<header>
<div class="header">
<h1>☣️ Once Human攻略ナビ</h1>
<p>Once Humanをわかりやすく攻略する情報サイト</p>
</div>
</header>

<nav>
<div class="nav">
<a href="#" onclick="topPage()">トップ</a>
<a href="#guides">初心者攻略</a>
<a href="#categories">攻略カテゴリ</a>
</div>
</nav>

<main>

<div class="search">
<input
id="search"
placeholder="🔍 攻略記事を検索..."
oninput="searchArticles()">
</div>

<section id="guides">

<h2>🌱 初心者攻略</h2>

<div class="cards" id="articleList"></div>

</section>

<section id="categories">

<h2>📚 攻略カテゴリ</h2>

<div class="cards">

<div class="card">
<h3>🔫 武器・ビルド</h3>
<p>武器の特徴やビルドをまとめます。</p>
</div>

<div class="card">
<h3>🧬 デビエーション</h3>
<p>デビエーションの入手方法や使い方をまとめます。</p>
</div>

<div class="card">
<h3>🏠 建築・領地</h3>
<p>拠点や施設、建築についてまとめます。</p>
</div>

<div class="card">
<h3>🗺️ マップ・探索</h3>
<p>マップや探索、素材集めについてまとめます。</p>
</div>

<div class="card">
<h3>👹 ボス攻略</h3>
<p>ボスやダンジョンの攻略情報をまとめます。</p>
</div>

<div class="card">
<h3>📦 アイテム・素材</h3>
<p>素材やアイテムの入手方法をまとめます。</p>
</div>

</div>

</section>

<div id="article"></div>

</main>

<footer>
Once Human攻略ナビ
</footer>

<script>

const articles=[

{
title:"Once Human｜初心者が最初にやること",
category:"初心者攻略",
text:`
<h2>Once Human｜初心者が最初にやること</h2>

<p>
Once Humanを始めたばかりの人向けに、
序盤で覚えておきたいポイントをまとめます。
</p>

<div class="notice">
<strong>この記事のポイント</strong><br>
・まずはメインミッションを進める<br>
・装備と素材を集める<br>
・拠点を整える<br>
・デビエーションを活用する
</div>

<h3>1. まずはメインミッションを進める</h3>

<p>
最初はマップを無理に隅々まで探索するより、
メインミッションを進めながらゲームの基本システムを覚えるのがおすすめです。
</p>

<h3>2. 素材を集める</h3>

<p>
木材や鉱石などの素材は、
建築やクラフトで必要になります。
探索中に見つけた素材はできるだけ集めておきましょう。
</p>

<h3>3. 拠点を作る</h3>

<p>
拠点ではアイテムの管理やクラフトなどを行えます。
序盤から少しずつ施設を整えていきましょう。
</p>

<h3>4. 装備を更新する</h3>

<p>
探索やミッションを進めると、
より強い装備を入手できます。
装備のレベルや性能を確認しながら更新していきましょう。
</p>

<h3>5. デビエーションを活用する</h3>

<p>
デビエーションはOnce Humanの重要な要素のひとつです。
入手したデビエーションの能力を確認して、
自分のプレイスタイルに合うものを活用しましょう。
</p>

<h3>まとめ</h3>

<p>
序盤は「メインミッション → 素材集め → 拠点整備 → 装備更新」
という流れを意識すると、ゲームを進めやすくなります。
</p>
`
},

{
title:"Once Human｜序盤のおすすめ装備",
category:"武器・ビルド",
text:`
<h2>Once Human｜序盤のおすすめ装備</h2>

<p>
序盤では入手した装備を比較しながら、
自分が使いやすい武器を見つけていきましょう。
</p>

<h3>武器を選ぶポイント</h3>

<p>
攻撃力だけでなく、
射程、攻撃速度、弾薬、特殊効果なども確認しましょう。
</p>

<h3>装備更新の考え方</h3>

<p>
新しいエリアや強敵に挑戦する前には、
現在の装備を確認して必要なら更新しましょう。
</p>
`
},

{
title:"Once Human｜デビエーションの基本",
category:"デビエーション",
text:`
<h2>Once Human｜デビエーションの基本</h2>

<p>
デビエーションにはさまざまな種類があり、
それぞれ異なる能力を持っています。
</p>

<h3>デビエーションを確認しよう</h3>

<p>
入手したデビエーションの能力を確認し、
探索や戦闘など目的に合わせて使い分けましょう。
</p>
`
}

];

const list=document.getElementById("articleList");
const article=document.getElementById("article");

function showArticles(data){

list.innerHTML="";

data.forEach((item,index)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`
<span class="category">${item.category}</span>
<h3>${item.title}</h3>
<p>Once Human攻略記事です。</p>
<button onclick="openArticle(${articles.indexOf(item)})">
記事を読む
</button>
`;

list.appendChild(card);

});

}

function openArticle(index){

article.style.display="block";

article.innerHTML=`
<div class="article-box">
${articles[index].text}

<div class="back">
<button onclick="closeArticle()">
記事一覧に戻る
</button>
</div>
</div>
`;

article.scrollIntoView({
behavior:"smooth"
});

}

function closeArticle(){

article.style.display="none";

}

function searchArticles(){

const word=
document.getElementById("search")
.value
.toLowerCase();

const result=articles.filter(item=>
item.title.toLowerCase().includes(word) ||
item.category.toLowerCase().includes(word)
);

showArticles(result);

}

function topPage(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}

showArticles(articles);

</script>

</body>
</html>
